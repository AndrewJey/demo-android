<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Android — Material 3 Notes Preview</title>
  <style>
    :root { --bg:#eef4f9; --card:#fff; --text:#102033; --muted:#5a6b80; --border:#d5e0ec; --primary:#0f766e; }
    [data-theme="dark"] { --bg:#0b1220; --card:#131f33; --text:#eef4fb; --muted:#97abc5; --border:#253755; --primary:#2dd4bf; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:grid; place-items:center; padding:18px; }
    .phone { width:min(400px,100%); background:var(--card); border:8px solid #1e293b; border-radius:30px; padding:18px; box-shadow:0 20px 50px rgba(0,0,0,.2); }
    .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    input, button { font:inherit; padding:9px 11px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
    button { cursor:pointer; font-weight:600; }
    .btn-primary { background:var(--primary); color:#042f2e; border-color:transparent; }
    .note { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px; border-bottom:1px solid var(--border); }
    .toast { margin-top:10px; font-size:12.5px; color:var(--primary); min-height:18px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="bar">
      <strong>🤖 Demo Android M3</strong>
      <button type="button" id="themeBtn">🌙</button>
    </div>
    <form id="form" style="display:flex;gap:8px;margin-bottom:12px;">
      <input id="inp" style="flex:1;" placeholder="Nueva nota Material 3..." required />
      <button type="submit" class="btn-primary">+</button>
    </form>
    <div id="list"></div>
    <div id="toast" class="toast" aria-live="polite"></div>
  </div>
  <script>
    (function () {
      var KEY = 'demo_android_notes_v1', TKEY = 'demo_android_theme';
      var notes = [];
      try { notes = JSON.parse(localStorage.getItem(KEY) || 'null') || ['Intent explícito a DetailActivity', 'Persistencia en SharedPreferences']; } catch (e) {}
      function $(id) { return document.getElementById(id); }
      function esc(v) { return String(v || '').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
      function setTheme(t) { document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem(TKEY, t); } catch (e) {} $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙'; }
      setTheme(localStorage.getItem(TKEY) === 'dark' ? 'dark' : 'light');
      $('themeBtn').addEventListener('click', function () { setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); });
      function toast(m) { $('toast').textContent = 'Toast: ' + m; }
      function render() {
        $('list').innerHTML = notes.length
          ? notes.map(function (n, i) { return '<div class="note"><span>' + esc(n) + '</span><button type="button" data-del="' + i + '">✕</button></div>'; }).join('')
          : '<div style="color:var(--muted);padding:12px 0;">Sin notas registradas.</div>';
      }
      $('form').addEventListener('submit', function (e) {
        e.preventDefault();
        var v = $('inp').value.trim(); if (!v) return;
        notes.unshift(v); try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {}
        $('inp').value = ''; toast('Nota guardada'); render();
      });
      $('list').addEventListener('click', function (e) {
        var b = e.target.closest('[data-del]'); if (!b) return;
        notes.splice(Number(b.getAttribute('data-del')), 1); try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {}
        toast('Nota eliminada'); render();
      });
      render();
    })();
  </script>
</body>
</html>
